name: Android Build

on:
  push:
    branches:
      - main
      - Anish
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Restore signing keystore
        env:
          LEARNINGQUEST_KEYSTORE_BASE64: ${{ secrets.LEARNINGQUEST_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$LEARNINGQUEST_KEYSTORE_BASE64" ]; then
            echo "ERROR: LEARNINGQUEST_KEYSTORE_BASE64 GitHub secret is not configured."
            exit 1
          fi
          echo "$LEARNINGQUEST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/learningquest-release.jks"
          test -s "$RUNNER_TEMP/learningquest-release.jks"

      - name: Build signed Release APK
        env:
          LEARNINGQUEST_KEYSTORE_PATH: ${{ runner.temp }}/learningquest-release.jks
          LEARNINGQUEST_KEYSTORE_PASSWORD: ${{ secrets.LEARNINGQUEST_KEYSTORE_PASSWORD }}
          LEARNINGQUEST_KEY_ALIAS: ${{ secrets.LEARNINGQUEST_KEY_ALIAS }}
          LEARNINGQUEST_KEY_PASSWORD: ${{ secrets.LEARNINGQUEST_KEY_PASSWORD }}
        run: |
          if [ -z "$LEARNINGQUEST_KEYSTORE_PASSWORD" ] || [ -z "$LEARNINGQUEST_KEY_ALIAS" ] || [ -z "$LEARNINGQUEST_KEY_PASSWORD" ]; then
            echo "ERROR: Signing secrets are not fully configured."
            exit 1
          fi
          ./gradlew assembleRelease --stacktrace

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LearningQuest-release-signed
          path: app/build/outputs/apk/release/app-release.apk
