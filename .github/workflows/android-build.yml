name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LEARNINGQUEST_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing LEARNINGQUEST_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/learningquest-release.jks"

      - name: Build signed release APK
        env:
          LEARNINGQUEST_KEYSTORE_PATH: ${{ runner.temp }}/learningquest-release.jks
          LEARNINGQUEST_KEYSTORE_PASSWORD: ${{ secrets.LEARNINGQUEST_KEYSTORE_PASSWORD }}
          LEARNINGQUEST_KEY_ALIAS: ${{ secrets.LEARNINGQUEST_KEY_ALIAS }}
          LEARNINGQUEST_KEY_PASSWORD: ${{ secrets.LEARNINGQUEST_KEY_PASSWORD }}
        run: |
          test -n "$LEARNINGQUEST_KEYSTORE_PASSWORD" || { echo "Missing LEARNINGQUEST_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$LEARNINGQUEST_KEY_ALIAS" || { echo "Missing LEARNINGQUEST_KEY_ALIAS"; exit 1; }
          test -n "$LEARNINGQUEST_KEY_PASSWORD" || { echo "Missing LEARNINGQUEST_KEY_PASSWORD"; exit 1; }
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LearningQuest-signed-release
          path: app/build/outputs/apk/release/app-release.apk